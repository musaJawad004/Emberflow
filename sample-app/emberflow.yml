# Emberflow pipeline for the sample app.
# Stage graph: install → lint + test (parallel) → build → deploy.
name: sample-app
# Default container image for every stage (and deploy); stages may override.
image: node:20-alpine
stages:
  # Installs npm dependencies; every other stage depends on it.
  - id: install
    run: npm install
  # lint and test both need only install, so Emberflow runs them in parallel.
  # lint parses each source file with node --check.
  - id: lint
    needs: [install]
    run: npm run lint
  # test runs the node:test suite (src/calc.test.js).
  - id: test
    needs: [install]
    run: npm test
  # Fan-in: build starts only after both lint and test have passed.
  - id: build
    needs: [lint, test]
    run: npm run build
# After the whole run passes, deploy starts the app in a container,
# mapping host port 8200 to the app's port 8080.
deploy:
  needs: [build]
  start: node src/server.js
  port: 8080
  hostPort: 8200
