name: Bug report
description: Something in Emberflow doesn't behave as documented
title: "fix: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please check [docs/issues/](../tree/main/docs/issues)
        and existing issues first — it may already be tracked.

        **Do not report security vulnerabilities here** — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: |
        Triggered a run via the dashboard, canceled it while `test` was running,
        expected the stage to show `canceled` but it stayed `running`.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start redis, server (`npm start`), dashboard (`npm run dev`)
        2. POST /api/runs with {"localPath": ".../sample-app"}
        3. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - server (API / worker / runner)
        - dashboard
        - sample-app
        - docker compose setup
        - docs
        - not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, Docker version, executor mode, how you run Emberflow.
      placeholder: |
        macOS 15 / Node 20.12 / Docker Desktop 4.30
        EMBER_EXECUTOR=docker, started via `npm start` (not compose)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server console output, stage logs, or browser console errors. Redact secrets.
      render: shell
